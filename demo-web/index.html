<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SegundoAire · Demo de interfaz</title>
  <meta name="description" content="Maqueta navegable del diseño de SegundoAire: splash El Respiro, onboarding del árbol, cuenta y selección de apps.">

  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&amp;family=Manrope:wght@300;400;500;600;700&amp;display=swap">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/phone.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/screens-setup.css">
</head>
<body>
  <div class="demo">
    <header class="demo-bar">
      <div class="demo-brand">
        <span class="demo-name">SegundoAire</span>
        <span class="demo-tag">Demo de interfaz</span>
      </div>
      <div class="demo-actions">
        <button type="button" class="chrome-btn chrome-btn--icon" id="themeToggle" aria-label="Cambiar tema claro u oscuro">
          <svg class="theme-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"></path></svg>
          <svg class="theme-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg>
        </button>
        <button type="button" class="chrome-btn" id="restartBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v4.5h4.5"></path></svg>
          <span>Reiniciar recorrido</span>
        </button>
      </div>
    </header>

    <main class="demo-stage" id="stage">
      <div class="phone-fit" id="phoneFit">
        <div class="phone" id="phone">
          <i class="phone-btn phone-btn--action" aria-hidden="true"></i>
          <i class="phone-btn phone-btn--vol-up" aria-hidden="true"></i>
          <i class="phone-btn phone-btn--vol-down" aria-hidden="true"></i>
          <i class="phone-btn phone-btn--power" aria-hidden="true"></i>
          <div class="phone-body">
            <div class="phone-screen" id="screen" data-tone="dark">
              <div class="scenes" id="scenes"></div>

              <div class="phone-status" aria-hidden="true">
                <span class="phone-time">9:41</span>
                <span class="phone-icons">
                  <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg>
                  <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1 4.2a10 10 0 0 1 15 0"></path><path d="M3.6 7a6.2 6.2 0 0 1 9.8 0"></path><circle cx="8.5" cy="10" r="1.3" fill="currentColor" stroke="none"></circle></svg>
                  <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="22" height="12" rx="3.6" stroke="currentColor" opacity="0.4"></rect><rect x="2" y="2" width="17" height="9" rx="2.3" fill="currentColor"></rect><path d="M24.2 4.4v4.2c.9-.3 1.6-1.2 1.6-2.1s-.7-1.8-1.6-2.1z" fill="currentColor" opacity="0.45"></path></svg>
                </span>
              </div>
              <div class="phone-island" aria-hidden="true"></div>
              <div class="phone-home" aria-hidden="true"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="demo-foot">
      <p class="demo-caption" id="caption" aria-live="polite"></p>
      <nav class="demo-nav" aria-label="Navegación de la demo">
        <button type="button" class="chrome-btn" id="prevBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
          <span>Anterior</span>
        </button>
        <ol class="demo-dots" id="dots" aria-label="Pantallas"></ol>
        <span class="demo-count" id="count" aria-hidden="true"></span>
        <button type="button" class="chrome-btn" id="nextBtn">
          <span>Siguiente</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
      </nav>
    </footer>
  </div>

  <!-- Classic scripts (no modules) so the page also works from file:// -->
  <script src="js/core/ease.js"></script>
  <script src="js/core/motion.js"></script>
  <script src="js/core/registry.js"></script>
  <script src="js/screens/splash.js"></script>
  <script src="js/screens/onboarding-data.js"></script>
  <script src="js/screens/onboarding-tree.js"></script>
  <script src="js/screens/onboarding.js"></script>
  <script src="js/screens/login.js"></script>
  <script src="js/screens/setup.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
